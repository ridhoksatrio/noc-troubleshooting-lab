frr version 10.0.1_git
frr defaults traditional
hostname pe1
no ipv6 forwarding
!
ip prefix-list CUST-IN seq 5 permit 192.0.2.0/24
!
ip route 0.0.0.0/0 10.0.0.2
ip route 192.0.2.0/24 172.16.10.2
!
interface eth2
 ip ospf network point-to-point
exit
!
router bgp 65000
 bgp router-id 1.1.1.2
 neighbor 1.1.1.1 remote-as 65000
 neighbor 1.1.1.1 update-source lo
 neighbor 172.16.10.2 remote-as 65100
 !
 address-family ipv4 unicast
  neighbor 172.16.10.2 default-originate
  neighbor 172.16.10.2 prefix-list CUST-IN in
 exit-address-family
exit
!
router ospf
 ospf router-id 1.1.1.2
 redistribute bgp
 network 1.1.1.2/32 area 0
 network 10.0.0.0/30 area 0
exit
!
